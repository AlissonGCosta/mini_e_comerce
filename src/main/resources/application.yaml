spring:
  application:
    name: mini_e_comerce

  Jackson:
    serialization:
      indent_output: true

  datasource:
    url: ${DATABASE_LH}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  flyway:
    enabled: true
    url: ${DATABASE_LH}
    user: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    generate-ddl: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        hbm2ddl:
          auto: update
    show-sql: true
